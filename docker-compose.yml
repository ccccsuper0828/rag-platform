version: '3.8'

services:
  # ollama:  <-- 注释掉或删除 ollama 服务，改用本地服务
  #   image: ollama/ollama:latest
  #   ...

  backend:
    build: ./backend
    container_name: mvp_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/logs:/app/logs
      - ./backend/data:/app/data  # 持久化用户数据
    # depends_on:  <-- 不再依赖容器内的 ollama
    #   - ollama
    extra_hosts:
      - "host.docker.internal:host-gateway" # 允许容器访问宿主机 localhost
    environment:
      # AI Partner Runner (runs on host)
      - AI_PARTNER_RUNNER_URL=http://host.docker.internal:9001
      # 固定的 JWT Secret Key（避免容器重启后 token 失效）
      - JWT_SECRET_KEY=rag-platform-mvp-secret-key-2026-do-not-share

  frontend:
    build: ./frontend
    container_name: mvp_frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
